count: 100

skill_range: [0.2, 0.8]   # each agent’s aiming/build speed
luck_range:  [0.1, 0.5]   # RNG bias for loot & crits

# Decision tuning
decision_commit_ticks: 6
decision_switch_min_delta: 0.15
decision_switch_cooldown_ticks: 8
decision_emergency_health: 0.25
decision_emergency_enemy_radius: 35
decision_storm_anticipation_enabled: true
decision_storm_escape_margin: 1.15
decision_storm_panic_margin: 0.95
decision_storm_weight: 1.0
decision_storm_lookahead_phases: 1

# Navigation intent & recovery
waypoint_reach_radius: 0.9    # stop_radius * 1.5 (with stop_radius=0.6)
waypoint_timeout_ticks: 180   # ~3 seconds @ 60 ticks/s
min_progress_per_tick: 0.02
stuck_ticks: 45               # ~0.75 seconds @ 60 ticks/s
waypoint_nudge_distance: 0.48 # 0.8 * stop_radius
waypoint_max_retries: 2
